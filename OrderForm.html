<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About You</title>
    <link rel="icon" href="img/Burger.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #968126a0;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            padding: 0.5rem;
            color: white;
            background-color: transparent;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            margin-left: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin-right: 1.8rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: black;
        }

        h2 {
            margin-top: 150px;
            text-align: center;
            color: black;
        }

        .p1{
            position: absolute;
            left: 60px;
            top: 0;
            width: 50%;
        }

        .inputs {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: 35px;
            max-width: 500px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        input:focus {
            border-color: #6d2c21;
            outline: none;
        }

        .p2{
            position: absolute;
            right: 0;
            top: 150px;     
            width: 50%; 
        }

        .orders {
            background: white;
            padding: 120px 50px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 50%;
            margin: auto;
        }

        button {
            background-color: #6d2c21;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            width: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 30px;
        }

        button:hover {
            background-color: #8c3b2d;
        }

        label {
            font-weight: bold;
            color: black;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">🍔 Foodie</a></div>
        <nav>
            <ul>
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#menu">Menu</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="p1">
        <h2>Complete the form to receive the orders.</h2>
    <div class="inputs">
        <form action="" method="post">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" required>

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>

            <label for="city">City</label>
            <input type="text" id="city" name="city" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required pattern="[+0-9\s\-]+" title="Enter a valid phone number.">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <center><button type="submit">Next</button></center>
        </form>
    </div>
    </div>
    <div class="p2">
        <div class="orders">
        </div>
    </div>
</body>
</html>
